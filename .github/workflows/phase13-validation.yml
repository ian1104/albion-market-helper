name: Phase 13 Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall .
      - name: Full pytest
        run: python -m pytest -q
      - name: FastAPI runtime smoke test
        run: |
          python run_server.py >/tmp/albion-market-helper-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/tmp/root.json; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ >/tmp/root.json
          curl --fail --silent http://127.0.0.1:8000/api/strategies >/tmp/strategies.json
          curl --fail --silent 'http://127.0.0.1:8000/api/opportunities?server=east&sort=profit&limit=5' >/tmp/opportunities.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/root.json'))['status'] == 'ok'
          strategies = json.load(open('/tmp/strategies.json'))
          assert isinstance(strategies.get('strategies'), list)
          opportunities = json.load(open('/tmp/opportunities.json'))
          assert isinstance(opportunities.get('opportunities'), list)
          PY
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
